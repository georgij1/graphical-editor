server:
  port: ${PORT:8080}

spring:
  jackson:
    serialization:
      write-dates-as-timestamps: false
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/graphical_editor}
    username: ${SPRING_DATASOURCE_USERNAME:editor}
    password: ${SPRING_DATASOURCE_PASSWORD:editor}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC

app:
  jwt-secret: ${JWT_SECRET:change-me-in-production}
  jwt-expiration-hours: 240
  minio-url: ${MINIO_URL:http://localhost:9000}
  minio-access-key: ${MINIO_ACCESS_KEY:minioadmin}
  minio-secret-key: ${MINIO_SECRET_KEY:minioadmin}
  minio-bucket: ${MINIO_BUCKET:graphical-editor}

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method
    tags-sorter: alpha
