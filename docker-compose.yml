services:
  backend:
    build: ./backend
    environment:
      JWT_SECRET: ${JWT_SECRET:-change-me-in-production}
      DATA_DIR: /data
      DOWNLOADS_DIR: /downloads
      JAVAFX_LIB: /opt/javafx/lib
      JAVA_MODULES: javafx.controls,javafx.fxml
      PORT: 8080
    volumes:
      - backend-data:/data
      - ./downloads:/downloads:ro
    restart: unless-stopped
    networks:
      - editor-net

  frontend:
    build: .
    ports:
      - "8080:80"
    volumes:
      - ./downloads:/usr/share/nginx/html/downloads:ro
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      - backend
    restart: unless-stopped
    networks:
      - editor-net

volumes:
  backend-data:

networks:
  editor-net: