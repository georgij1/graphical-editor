services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-graphical_editor}
      POSTGRES_USER: ${POSTGRES_USER:-editor}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-editor}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    restart: unless-stopped
    networks:
      - editor-net

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
    volumes:
      - minio-data:/data
    ports:
      - "9000:9000"
      - "9001:9001"
    restart: unless-stopped
    networks:
      - editor-net

  ai-service:
    build: ./ai-service
    environment:
      JWT_SECRET: ${JWT_SECRET:-change-me-in-production}
      PORT: 8080
      OLLAMA_URL: ${OLLAMA_URL:-http://host.docker.internal:11434}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped
    networks:
      - editor-net

  backend:
    build: ./backend
    environment:
      JWT_SECRET: ${JWT_SECRET:-change-me-in-production}
      DATA_DIR: /data
      DOWNLOADS_DIR: /downloads
      JAVAFX_LIB: /opt/javafx/lib
      JAVA_MODULES: javafx.controls,javafx.fxml
      PORT: 8080
      MINIO_URL: ${MINIO_URL:-http://minio:9000}
      MINIO_ACCESS_KEY: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_SECRET_KEY: ${MINIO_ROOT_PASSWORD:-minioadmin}
      MINIO_BUCKET: ${MINIO_BUCKET:-graphical-editor}
      SPRING_DATASOURCE_URL: ${SPRING_DATASOURCE_URL:-jdbc:postgresql://postgres:5432/graphical_editor}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-editor}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-editor}
    volumes:
      - backend-data:/data
      - ./downloads:/downloads:ro
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      - minio
      - postgres
    restart: unless-stopped
    networks:
      - editor-net

  frontend:
    build: .
    ports:
      - "8080:80"
    volumes:
      - ./downloads:/usr/share/nginx/html/downloads:ro
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      - backend
      - ai-service
    restart: unless-stopped
    networks:
      - editor-net

volumes:
  backend-data:
  minio-data:
  postgres-data:

networks:
  editor-net: