server:
  port: ${PORT:8080}

spring:
  servlet:
    multipart:
      max-file-size: 64MB
      max-request-size: 64MB
  jackson:
    serialization:
      write-dates-as-timestamps: false
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/graphical_editor}
    username: ${SPRING_DATASOURCE_USERNAME:editor}
    password: ${SPRING_DATASOURCE_PASSWORD:editor}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC

app:
  jwt-secret: ${JWT_SECRET:change-me-in-production}
  javafx-lib: ${JAVAFX_LIB:/opt/javafx/lib}
  java-modules: ${JAVA_MODULES:javafx.controls,javafx.fxml}
  downloads-dir: ${DOWNLOADS_DIR:/downloads}

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method
    tags-sorter: alpha
