server:
  port: ${PORT:8080}

spring:
  jackson:
    serialization:
      write-dates-as-timestamps: false

# Data directory for JSON persistence
app:
  data-dir: ${DATA_DIR:/data}
  jwt-secret: ${JWT_SECRET:change-me-in-production}
  jwt-expiration-hours: 240

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method
    tags-sorter: alpha
