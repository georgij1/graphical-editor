server:
  port: ${PORT:8080}

spring:
  jackson:
    serialization:
      write-dates-as-timestamps: false

app:
  jwt-secret: ${JWT_SECRET:change-me-in-production}
  jwt-expiration-hours: 240

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method
    tags-sorter: alpha
    urls-primary-name: Auth Service
    urls:
      - name: Auth Service
        url: /v3/api-docs/auth-service
      - name: AI Service
        url: /v3/api-docs/ai-service
      - name: Analyzer Service
        url: /v3/api-docs/analyzer-service
      - name: Storage Service
        url: /v3/api-docs/storage-service
      - name: Projects Service
        url: /v3/api-docs/projects-service
