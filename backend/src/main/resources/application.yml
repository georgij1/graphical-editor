server:
  port: ${PORT:8080}

spring:
  jackson:
    serialization:
      write-dates-as-timestamps: false

app:
  jwt-secret: ${JWT_SECRET:change-me-in-production}
  jwt-expiration-hours: 240

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method
    tags-sorter: alpha
    urls-primary-name: 1. Auth Service
    urls:
      - name: 1. Auth Service
        url: /v3/api-docs/auth-service
      - name: 2. Projects Service
        url: /v3/api-docs/projects-service
      - name: 3. AI Service
        url: /v3/api-docs/ai-service
      - name: 4. Analyzer Service
        url: /v3/api-docs/analyzer-service
      - name: 5. Storage Service
        url: /v3/api-docs/storage-service
