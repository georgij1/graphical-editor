server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    location /api/ {
        proxy_pass http://backend:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # Swagger UI and OpenAPI spec are served by the backend.
    location /swagger-ui {
        proxy_pass http://backend:8080;
        proxy_set_header Host $host;
    }
    location = /swagger-ui.html {
        proxy_pass http://backend:8080;
        proxy_set_header Host $host;
    }
    location /v3/api-docs {
        proxy_pass http://backend:8080;
        proxy_set_header Host $host;
    }

    # Local AI (Ollama) running on the host machine. Proxying server-side avoids
    # browser CORS restrictions. Override AI_BASE_URL at build time if Ollama
    # lives elsewhere.
    location /ai/ {
        proxy_pass http://host.docker.internal:11434/;
        proxy_http_version 1.1;
        proxy_set_header Host localhost:11434;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
    }

    # JavaFX build service: compiles an exported project archive into a runnable
# JAR or bundle. Overridable at build time if it lives elsewhere.
location /build {
        proxy_pass http://builder:8081;
        proxy_set_header Host $host;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
        # Compilation output can be long; stream it through untouched.
        proxy_buffering off;
        client_max_body_size 64m;
    }

    # Client artifacts are served from a mounted directory; a missing file must
    # return 404 (not the SPA fallback) so the UI can show "coming soon".
    location /downloads/ {
        try_files $uri =404;
    }

    # The Flutter service worker is the entry point of the cache: the browser
    # must always re-download it (and the bootstrap documents) so a redeploy is
    # picked up instead of being shadowed by a stale worker.
    location = /flutter_service_worker.js {
        add_header Cache-Control "no-store, no-cache, must-revalidate" always;
        expires -1;
    }

    # The bootstrap and the compiled bundle must always be re-downloaded: there
    # is no service worker to invalidate them anymore.
    location = /main.dart.js {
        add_header Cache-Control "no-store, no-cache, must-revalidate" always;
        expires -1;
    }

    location = /flutter_bootstrap.js {
        add_header Cache-Control "no-store, no-cache, must-revalidate" always;
        expires -1;
    }

    location = /index.html {
        add_header Cache-Control "no-store, no-cache, must-revalidate" always;
        expires -1;
    }

    location = /version.json {
        add_header Cache-Control "no-store, no-cache, must-revalidate" always;
        expires -1;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}