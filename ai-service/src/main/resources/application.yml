server:
  port: ${PORT:8080}

spring:
  jackson:
    serialization:
      write-dates-as-timestamps: false

app:
  jwt-secret: ${JWT_SECRET:change-me-in-production}
  jwt-expiration-hours: 240
  ollama-url: ${OLLAMA_URL:http://host.docker.internal:11434}

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method
    tags-sorter: alpha
