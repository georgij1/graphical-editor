server:
  port: ${PORT:8080}

spring:
  jackson:
    serialization:
      write-dates-as-timestamps: false
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/graphical_editor}
    username: ${SPRING_DATASOURCE_USERNAME:editor}
    password: ${SPRING_DATASOURCE_PASSWORD:editor}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC

app:
  jwt-secret: ${JWT_SECRET:change-me-in-production}
  jwt-expiration-hours: 240
  minio-url: ${MINIO_URL:http://localhost:9000}
  minio-access-key: ${MINIO_ACCESS_KEY:minioadmin}
  minio-secret-key: ${MINIO_SECRET_KEY:minioadmin}
  minio-bucket: ${MINIO_BUCKET:graphical-editor}
  oauth:
    frontend-base-url: ${OAUTH_FRONTEND_BASE_URL:http://localhost:8080}
    google:
      client-id: ${OAUTH_GOOGLE_CLIENT_ID:}
      client-secret: ${OAUTH_GOOGLE_CLIENT_SECRET:}
      redirect-uri: ${OAUTH_GOOGLE_REDIRECT_URI:}
    yandex:
      client-id: ${OAUTH_YANDEX_CLIENT_ID:}
      client-secret: ${OAUTH_YANDEX_CLIENT_SECRET:}
      redirect-uri: ${OAUTH_YANDEX_REDIRECT_URI:}
    vk:
      client-id: ${OAUTH_VK_CLIENT_ID:}
      client-secret: ${OAUTH_VK_CLIENT_SECRET:}
      redirect-uri: ${OAUTH_VK_REDIRECT_URI:}
    tbank:
      client-id: ${OAUTH_TBANK_CLIENT_ID:}
      client-secret: ${OAUTH_TBANK_CLIENT_SECRET:}
      redirect-uri: ${OAUTH_TBANK_REDIRECT_URI:}

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method
    tags-sorter: alpha
